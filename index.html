<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png?v=20260725-1" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260725-1" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260725-1" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260725-1" />
  <meta name="apple-mobile-web-app-title" content="MelodyTrack" />
  <link rel="manifest" href="/site.webmanifest?v=20260725-1" />
  <title>MelodyTrack CRM</title>
  <script>
    try {
      if (localStorage.getItem("melodytrack.theme") === "dark") {
        document.documentElement.dataset.theme = "dark";
      }
    } catch {
      // The application can still boot when storage is unavailable.
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      --boot-bg: #f4e8c8;
      --boot-card: #f8edcf;
      --boot-text: #33271a;
      --boot-muted: #6f5838;
      --boot-accent: #8b6226;
      --boot-border: #d8c8a7;
      --boot-shadow: 0 18px 50px rgba(72, 52, 27, 0.12);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --boot-bg: #15120f;
      --boot-card: #1f1914;
      --boot-text: #f1e7d1;
      --boot-muted: #d2c0a4;
      --boot-accent: #d0a35b;
      --boot-border: #4d3a28;
      --boot-shadow: 0 20px 55px rgba(0, 0, 0, 0.4);
    }

    html,
    body,
    #root {
      min-height: 100%;
      margin: 0;
      background: var(--boot-bg);
    }

    .app-loading-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      min-height: 100dvh;
      padding: 24px;
      background: var(--boot-bg);
      color: var(--boot-text);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }

    .app-loading-card {
      display: grid;
      justify-items: center;
      width: min(280px, 100%);
      padding: 28px 24px 24px;
      border: 1px solid var(--boot-border);
      border-radius: 14px;
      background: var(--boot-card);
      box-shadow: var(--boot-shadow);
    }

    .app-loading-mark {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 16px;
      background: var(--boot-accent);
      overflow: hidden;
    }

    .app-loading-mark img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .app-loading-title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .app-loading-message {
      min-height: 20px;
      margin: 8px 0 18px;
      color: var(--boot-muted);
      font-size: 14px;
      line-height: 20px;
      text-align: center;
    }

    .app-loading-spinner {
      width: 26px;
      height: 26px;
      box-sizing: border-box;
      border: 3px solid color-mix(in srgb, var(--boot-accent) 24%, transparent);
      border-top-color: var(--boot-accent);
      border-radius: 50%;
      animation: app-loading-spin 800ms linear infinite;
    }

    @keyframes app-loading-spin {
      to {
        transform: rotate(1turn);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loading-spinner {
        animation-duration: 1600ms;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="app-loading-screen" role="status" aria-live="polite">
      <div class="app-loading-card">
        <div class="app-loading-mark" aria-hidden="true">
          <img src="/favicon.svg?v=20260725-1" alt="" width="52" height="52" />
        </div>
        <p class="app-loading-title">MelodyTrack</p>
        <p class="app-loading-message">Загружаем приложение…</p>
        <div class="app-loading-spinner" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
